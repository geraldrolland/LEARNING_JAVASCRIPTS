<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Data Processing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
        }

        #output {
            margin-top: 20px;
            border: 1px solid #ccc;
            padding: 15px;
            width: 350px;
        }
    </style>
</head>
<body>

    <h2>CSV Data Processing Using Web Worker</h2>

    <input type="file" id="csvFile" accept=".csv">

    <br><br>

    <button id="processBtn">Process CSV</button>

    <div id="output"></div>

    <script>
        const worker = new Worker("csv_proccess_worker.js");

        const fileInput = document.getElementById("csvFile");
        const processBtn = document.getElementById("processBtn");
        const output = document.getElementById("output");

        processBtn.addEventListener("click", () => {

            const file = fileInput.files[0];

            if (!file) {
                alert("Please select a CSV file.");
                return;
            }

            const reader = new FileReader();

            reader.onload = function () {

                output.innerHTML = "Processing CSV...";

                worker.postMessage(reader.result);

            };

            reader.readAsText(file);

        });

        worker.onmessage = function (e) {

            const data = e.data;

            output.innerHTML = `
                <h3>Processing Complete</h3>
                <p><strong>Total Rows:</strong> ${data.rows}</p>
                <p><strong>Total Columns:</strong> ${data.columns}</p>
                <p><strong>Empty Cells:</strong> ${data.emptyCells}</p>
            `;

        };
    </script>

</body>
</html>
