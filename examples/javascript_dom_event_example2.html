<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
    body {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        height: 100vh;
        flex-direction: column;
    }
    #tab-container {
        display: flex;
        justify-content: space-between;
        width: 100%;
        max-width: 600px;
        margin-top: 20px;
        column-gap: 4px;
    }
    #tab-container div {
        padding: 10px;
        border: 1px solid #ccc;
        cursor: pointer;
        text-align: center;
        flex: 1;
    }

    #tab-content {
        margin-top: 20px;
        width: 100%;
        max-width: 600px;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 10px;
        min-height: 150px;
    }
    </style>
</head>
<body>
    <div id="tab-container">
        <div>tab 1</div>
        <div>tab 2</div>
        <div>tab 3</div>
    </div>

    <div id="tab-content">
        <p>Content for Tab 1</p>
    </div>
</body>
<script>
    const tabs = document.querySelectorAll('#tab-container div');
    const tabContent = document.getElementById('tab-content');

    const contents = [
        'Content for Tab 1',
        'Content for Tab 2',
        'Content for Tab 3'
    ];

    tabs.forEach((tab, index) => {
        tab.addEventListener('click', () => {
            tabContent.innerHTML = `<p>${contents[index]}</p>`;
        });
    });
</script>
</html>
