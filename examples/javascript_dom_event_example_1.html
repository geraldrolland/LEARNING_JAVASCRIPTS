<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        height: 100vh;
        flex-direction: column;
    }

    #searchInput {
        padding: 10px;
        font-size: 16px;
        width: 450px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    #product-container {
        margin-top: 20px;
        width: 100%;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 10px;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        row-gap: 12px;
    }

    #product {
        padding: 10px;
        border: 1px solid #eee;
        flex-basis: 1/3;
        width: 25%;
        height: 250px;

    }

    #search-container {
        margin-top: 20px;
        display: flex;
        justify-content: space-between;
        column-gap: 4px;
    }

    #search-btn {
        padding: 10px 20px;
        font-size: 16px;
        background-color: #007BFF;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    
</style>
<body>
    <div id="search-container">
    <input type="text" id="searchInput" placeholder="search products here ...">
    <button id="search-btn">Search</button>
    </div>

    <div id="product-container">

    </div>
</body>
<script>
    const products = [
        { name: 'Apple iPhone 13', price: 999 },
        { name: 'Samsung Galaxy S21', price: 899 },
        { name: 'Google Pixel 6', price: 799 },
        { name: 'OnePlus 9 Pro', price: 969 },
        { name: 'Sony Xperia 1 III', price: 1199 },
        { name: 'Xiaomi Mi 11', price: 749 },
        { name: 'Huawei P50 Pro', price: 1099 },
        { name: 'Motorola Edge Plus', price: 999 }
    ];

    products.forEach(product => {
        const productElement = document.createElement('div');
        productElement.id = 'product';
        productElement.innerHTML = `<h3>${product.name}</h3><p>Price: $${product.price}</p>`;
        document.getElementById('product-container').appendChild(productElement);
    });

        document.getElementById('search-btn').addEventListener('click', () => {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const productElements = document.querySelectorAll('#product-container #product');
            
            productElements.forEach(productElement => {
                const productName = productElement.querySelector('h3').textContent.toLowerCase();
                if (productName.includes(searchTerm)) {
                    productElement.style.display = 'block';
                } else {
                    productElement.style.display = 'none';
                }
            });
            
            if (Array.from(productElements).filter(productElement => productElement.style.display === 'block').length === 0) {
                alert('No products found');
            }
        });

</script>
</html>
